name: build

# Release rules:
#   - push a tag vX.Y.Z, or
#   - push a commit to main whose message contains [release vX.Y.Z]
# Any other push to main only checks that the app builds (debug APK as a workflow artifact).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test Go server
        working-directory: server
        run: go test ./...

      - name: Decide version
        id: ver
        env:
          MSG: ${{ github.event.head_commit.message }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=""
          tag_re='^v([0-9]+\.[0-9]+\.[0-9]+)$'
          msg_re='\[release v([0-9]+\.[0-9]+\.[0-9]+)\]'
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" =~ $tag_re ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              echo "::error::Tag '$REF_NAME' does not look like vX.Y.Z"
              exit 1
            fi
          elif [[ "$MSG" =~ $msg_re ]]; then
            VERSION="${BASH_REMATCH[1]}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            IFS=. read -r X Y Z <<< "$VERSION"
            echo "code=$(( 10#$X * 1000000 + 10#$Y * 1000 + 10#$Z ))" >> "$GITHUB_OUTPUT"
            echo "Release build $VERSION"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "Not a release: build check only"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Firebase config
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON_BASE64 is not set"
            exit 1
          fi
          echo "$GSJ" | base64 -d > app/google-services.json
          APP_ID=$(jq -r '.client[0].client_info.android_client_info.package_name' app/google-services.json)
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::package_name not found in google-services.json"
            exit 1
          fi
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Prepare signing key
        if: steps.ver.outputs.version != ''
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"


      - name: Apply approved icon gradient
        if: steps.ver.outputs.version != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -m pip install --quiet Pillow
          python tools/update_icon_assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/icon-192.png pwa/icon-512.png app/src/main/res/drawable-nodpi/app_icon.png app/src/main/res/drawable-nodpi/ic_launcher_background.png app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png art/icon.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply approved icon gradient for v${VERSION}"
            git push origin HEAD:main
          fi

      - name: Build release APK
        if: steps.ver.outputs.version != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          REPO: ${{ github.repository }}
        run: |
          gradle assembleRelease \
            -PfphoneAppId="$APP_ID" \
            -PfphoneUpdateRepo="$REPO" \
            -PfphoneVersionName="$VERSION" \
            -PfphoneVersionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk "Kukukha-$VERSION.apk"

      - name: Push release tag
        if: steps.ver.outputs.version != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG")" = "$(git rev-parse HEAD)"
          else
            git tag "$TAG" HEAD
          fi
          git push origin "refs/tags/$TAG"

      - name: Publish release
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: main
          name: Кукуха ${{ steps.ver.outputs.version }}
          files: Kukukha-${{ steps.ver.outputs.version }}.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      - name: Build check (debug APK)
        if: steps.ver.outputs.version == ''
        env:
          REPO: ${{ github.repository }}
        run: gradle assembleDebug -PfphoneAppId="$APP_ID" -PfphoneUpdateRepo="$REPO"

      - name: Keep the debug APK
        if: steps.ver.outputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: Kukukha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
