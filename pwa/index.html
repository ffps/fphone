<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5265a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Кукуха">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
  <title>Кукуха</title>
</head>
<body>
  <main id="app">
    <section id="login-screen" class="screen login-screen">
      <div class="brand"><img src="icon-192.png" alt=""><div><h1>Кукуха</h1><p><small>Персональная система видеосвязи<small></p></div></div>
      <form id="login-form" class="panel">
        <label>Логин<input id="login" name="login" autocomplete="username" required maxlength="64"></label>
        <label>Пароль<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary" type="submit">Войти</button>
      </form>
    </section>

    <section id="main-screen" class="screen hidden">
      <header class="topbar">
        <div class="brand-small"><img src="icon-192.png" alt=""><strong id="top-title">Контакты</strong></div>
        <button id="settings-open" class="icon-button" aria-label="Настройки">⋮</button>
      </header>
      <div id="connection-state" class="connection">Подключение…</div>

      <div class="view-heading">
      <nav id="main-tabs" class="main-tabs" aria-label="Разделы">
        <button id="tab-contacts" class="tab-button selected" type="button">Контакты</button>
        <button id="tab-history" class="tab-button" type="button">Недавние</button>
      </nav>
        <div>
          <button id="refresh-contacts" class="text-button"><big><big>↺</big></big></button>
          <button id="clear-history" class="text-button hidden">✖</button>
        </div>
      </div>

      <div id="contacts-view" class="view">
        <div id="contacts-list" class="contact-list"></div>
        <p id="contacts-empty" class="muted empty hidden">Список пуст</p>
      </div>

      <section id="history-view" class="view hidden">
        <div id="history-list" class="history-list"></div>
        <p id="history-empty" class="muted empty">Список пуст</p>
      </section>

      <section id="settings-view" class="view hidden">
        <div class="panel profile-panel">
          <img id="my-avatar" class="my-avatar" src="icon-192.png" alt="Фото профиля">
          <label class="file-button">Изменить фото<input id="avatar-file" type="file" accept="image/*" hidden></label>
          <button id="avatar-delete" class="text-button">Удалить фото</button>
          <label>Имя<input id="my-name" maxlength="64"></label>
          <button id="save-profile" class="primary">Сохранить</button>
          <p id="profile-error" class="error" role="alert"></p>
          <div class="push-settings">
            <p id="push-status" class="muted">Уведомления не настроены</p>
            <button id="push-enable" class="primary" type="button">Включить уведомления</button>
            <button id="push-disable" class="text-button hidden" type="button">Отключить уведомления</button>
          </div>
        </div>
        <button id="logout" class="danger-button">Выйти из аккаунта</button>
      </section>
    </section>

    <section id="call-screen" class="screen call-screen hidden">
      <div class="call-top"><span id="call-state">Вызов</span><span id="call-kind">Аудио</span></div>
      <div id="call-peer" class="call-peer">Абонент</div>
      <div class="video-stage">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
        <div id="video-placeholder" class="video-placeholder">Кукуха</div>
      </div>
      <audio id="remote-audio" autoplay></audio>
      <div id="call-message" class="call-message">Ожидание…</div>
      <div id="incoming-actions" class="call-actions hidden">
        <button id="answer-audio" class="round-button answer" type="button" aria-label="Ответить" title="Ответить">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.56 3.58.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.19 2.46.56 3.58a1 1 0 0 1-.25 1.01z"/></svg>
        </button>
        <button id="answer-video" class="round-button answer hidden" type="button" aria-label="Ответить с видео" title="Ответить с видео">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 10.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l5 5v-13z"/></svg>
        </button>
        <button id="reject-call" class="round-button reject" type="button" aria-label="Отклонить" title="Отклонить">
          <svg class="phone-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.56 3.58.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.19 2.46.56 3.58a1 1 0 0 1-.25 1.01z"/></svg>
        </button>
      </div>
      <div id="active-actions" class="call-actions hidden">
        <button id="camera-switch" class="round-button hidden" type="button" aria-label="Переключить камеру" title="Переключить камеру"></button>
        <button id="mute-call" class="round-button" type="button" aria-label="Выключить микрофон" title="Выключить микрофон"></button>
        <button id="camera-call" class="round-button hidden" type="button" aria-label="Выключить камеру" title="Выключить камеру"></button>
        <button id="hangup-call" class="round-button reject" type="button" aria-label="Завершить вызов" title="Завершить вызов"></button>
      </div>
    </section>
    <div id="contact-modal" class="modal-backdrop hidden" role="presentation">
      <section class="contact-dialog" role="dialog" aria-modal="true" aria-labelledby="contact-dialog-name">
        <button id="contact-dialog-close" class="modal-close" type="button" aria-label="Закрыть">×</button>
        <img id="contact-dialog-avatar" class="contact-dialog-avatar" src="icon-192.png" alt="">
        <h2 id="contact-dialog-name"></h2>
        <p id="contact-dialog-login" class="contact-dialog-login"></p>
        <p id="contact-dialog-status" class="contact-dialog-status"></p>
        <p id="contact-dialog-last-call" class="contact-dialog-last-call hidden"></p>
        <div class="contact-dialog-actions">
          <button id="contact-message-open" class="primary contact-action" type="button">✉ Сообщение</button>
          <button id="contact-call" class="primary contact-action" type="button">☎ Вызов</button>
        </div>
      </section>
    </div>

    <div id="message-modal" class="modal-backdrop hidden" role="presentation">
      <section class="message-dialog" role="dialog" aria-modal="true" aria-labelledby="message-dialog-title">
        <h2 id="message-dialog-title">Сообщение</h2>
        <label for="message-text">Текст сообщения</label>
        <textarea id="message-text" rows="4" maxlength="1000" placeholder="Введите сообщение"></textarea>
        <p id="message-error" class="error" role="alert"></p>
        <div class="message-dialog-actions">
          <button id="message-cancel" class="text-button" type="button">Отмена</button>
          <button id="message-send" class="primary" type="button" disabled>Отправить</button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
